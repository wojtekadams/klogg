name: "Website"

on:
  push:
    branches: [ master ]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Hugo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends hugo
          hugo version

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Build website
        working-directory: website
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/" --destination public

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: website/public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
