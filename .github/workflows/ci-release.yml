name: "Make CI Release"

on:
  workflow_dispatch:
    inputs:
      ci-run-id:
        description: "Run ID of the CI Build workflow (empty = successful CI run of the selected branch head)"
        required: false
      tag:
        description: "Release tag. 'continuous' is replaced on every release, any other tag must not exist yet"
        required: true
        default: continuous
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: true

permissions:
  contents: write
  # actions: write is needed to start the Website workflow after adding a news post
  actions: write

concurrency:
  group: ci-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # full history and tags for the news post change list
          fetch-depth: 0

      - name: Find CI run
        run: |
          run_id="${{ inputs.ci-run-id }}"
          if [ -z "$run_id" ]; then
            # release only what was built from the commit this workflow runs on,
            # never an older build of the branch
            run_id=$(gh run list --workflow ci-build.yml --commit "$GITHUB_SHA" --status success \
                       --limit 1 --json databaseId --jq '.[0].databaseId')
            if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
              echo "::error::No successful CI Build for commit $GITHUB_SHA (${GITHUB_REF_NAME}). Wait for CI to finish (or re-run it) and start the release again, or pass ci-run-id explicitly."
              exit 1
            fi
          fi
          head_sha=$(gh run view "$run_id" --json headSha --jq .headSha)
          echo "Using CI run $run_id (commit $head_sha)"
          echo "CI_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "CI_HEAD_SHA=$head_sha" >> "$GITHUB_ENV"

      - name: Download artifacts
        run: |
          gh run download "$CI_RUN_ID" --dir artifacts --pattern 'packages-*' --pattern 'klogg_version'
          ls -R artifacts

      - name: Prepare release assets
        run: |
          ./.github/scripts/prepare-release.sh artifacts release
          echo "KLOGG_VERSION=$(cat artifacts/klogg_version/klogg_version.txt)" >> "$GITHUB_ENV"

      - name: Publish release
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            if [ "$RELEASE_TAG" = "continuous" ]; then
              gh release delete "$RELEASE_TAG" --cleanup-tag --yes
            else
              echo "::error::Release $RELEASE_TAG already exists"
              exit 1
            fi
          fi

          prerelease_flag=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            prerelease_flag="--prerelease"
          fi

          cat > notes.md <<NOTES
          klogg $KLOGG_VERSION

          Built by CI run https://github.com/$GH_REPO/actions/runs/$CI_RUN_ID from commit $CI_HEAD_SHA.

          | Platform | Files |
          |---|---|
          | Windows x64 | \`*-setup.exe\` installer, \`*-portable.zip\` |
          | Ubuntu 24.04 | \`*-noble.deb\` |
          | Ubuntu 26.04 | \`*-resolute.deb\` |
          | Linux (any distro with glibc 2.35+) | \`*-x86_64.AppImage\` |
          | Linux (other) | \`*-linux-bin.tar.gz\` |
          | macOS (Apple Silicon) | \`*-mac-arm64.dmg\` |

          Debug symbols: \`*-pdb.zip\`, \`*-linux-symbols.tar\`, \`*-dSYM.zip\`. Checksums: \`*-sha256.txt\`.
          NOTES

          gh release create "$RELEASE_TAG" release/* \
            --target "$CI_HEAD_SHA" \
            --title "klogg $KLOGG_VERSION" \
            --notes-file notes.md \
            $prerelease_flag

      - name: Add news post to website
        if: ${{ inputs.tag != 'continuous' }}
        run: |
          ./.github/scripts/add-release-news.sh "$RELEASE_TAG" "$KLOGG_VERSION" "$CI_HEAD_SHA"
          if git diff --quiet && [ -z "$(git status --porcelain docs/content/news)" ]; then
            echo "No news post added"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/content/news
          git commit -m "Website: news post for release $RELEASE_TAG"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          # pushes made with GITHUB_TOKEN do not trigger workflows, start the website build explicitly
          gh workflow run website.yml --ref "$GITHUB_REF_NAME"
