<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ "" | relURL }}">
      <img src="{{ "klogg.png" | relURL }}" alt="" width="32" height="32">
      <span>klogg</span>
    </a>
    <nav class="nav">
      {{ $current := . }}
      {{ range site.Menus.main }}
        {{ $active := and .Page (or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) (eq $current.Section (strings.TrimPrefix "/" .PageRef))) }}
        <a href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
