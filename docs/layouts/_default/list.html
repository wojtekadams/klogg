{{ define "main" }}
<section class="content page">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  {{ range .Pages.GroupByDate "2006" }}
    <h2 class="year">{{ .Key }}</h2>
    <ul class="post-list">
      {{ range .Pages.ByDate.Reverse }}
        <li>
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2" }}</time>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </li>
      {{ end }}
    </ul>
  {{ end }}
</section>
{{ end }}
